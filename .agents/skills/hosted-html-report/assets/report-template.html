<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TITLE</title>
<style>
  /* Nikunj Khitha portfolio design tokens — dark theme, ported from
     src/app/globals.css and tailwind.config.ts. This report has no light
     mode: dark is the site's primary brand impression and the template is a
     single static file with no theme toggle. */
  :root{
    --bg:#0A0F1E; --card:#141B2B; --card-2:#1B2436; --fg:#E4EDE9;
    --muted:#1B2436; --muted-fg:#7C87A0; --border:#252E3F;
    --primary:#29D6B9; --primary-dark:#0C8C79; --accent-dark:#134D40;
    --red:#F87171; --red-bg:rgba(248,113,113,.1); --red-br:rgba(248,113,113,.35);
    --green:#34D399; --green-bg:rgba(52,211,153,.1); --green-br:rgba(52,211,153,.35);
    --amber:#FBBF24; --amber-bg:rgba(251,191,36,.1); --amber-br:rgba(251,191,36,.35);
    --blue:#60A5FA; --blue-bg:rgba(96,165,250,.1); --blue-br:rgba(96,165,250,.35);
    --sans:"Avenir Next","Segoe UI",system-ui,sans-serif;
    --mono:"SF Mono",Consolas,Monaco,monospace;
    --sh:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--sans);font-size:13.5px;line-height:24px;color:var(--fg);background:var(--bg)}
  .wrap{display:grid;grid-template-columns:252px minmax(0,1fr);gap:32px;max-width:1300px;margin:0 auto;padding:0 24px 80px}

  header.top{background:linear-gradient(135deg,var(--bg),var(--accent-dark));border-bottom:1px solid var(--border);padding:32px 0 44px;margin-bottom:32px}
  header.top .in{max-width:1300px;margin:0 auto;padding:0 24px}
  header.top .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  header.top .brand img{width:32px;height:32px;border-radius:8px}
  header.top .brand a{color:#fff;text-decoration:none;font-weight:800;font-size:13px;letter-spacing:-.2px}
  /* NOTE: colour must be set on these directly. A generic `p{color:...}` rule
     applies straight to the element and always beats an inherited colour from
     header.top, which silently renders dark text on the dark gradient. */
  header.top .eyebrow{color:var(--primary);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.95;margin-bottom:10px}
  header.top h1{color:#fff;margin:0 0 12px;font-size:26px;line-height:34px;letter-spacing:-.5px;font-weight:800}
  header.top p{color:#fff;margin:0;max-width:830px;font-size:14px;line-height:24px;opacity:.85}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .badge{color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600;text-decoration:none}

  /* Glassmorphism, ported from globals.css' tiered blur system:
     --blur-surface (12px, cards/panels), .glass fill ~68% background opacity.
     A plain rgba() fill stands in for the site's color-mix()-based tokens
     since this file has no access to the running Tailwind build. */
  nav.side{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;
    background:rgba(20,27,43,.68);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;box-shadow:var(--sh)}
  nav.side .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-fg);font-weight:700;padding:6px 8px 8px}
  nav.side a{display:block;padding:6px 9px;border-radius:6px;color:var(--muted-fg);text-decoration:none;font-size:12px;line-height:17px}
  nav.side a:hover{background:rgba(255,255,255,.04);color:var(--fg)}
  nav.side a.on{background:rgba(41,214,185,.12);color:var(--primary);font-weight:700}
  nav.side a .n{display:inline-block;min-width:17px;color:var(--muted-fg);font-weight:700;font-size:10.5px}

  main{min-width:0}
  section{background:rgba(20,27,43,.68);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:26px 30px;margin-bottom:20px;
    box-shadow:0 16px 48px rgba(41,214,185,.1);scroll-margin-top:16px}
  h2{margin:0 0 4px;font-size:20px;line-height:28px;letter-spacing:-.4px;font-weight:800;color:var(--fg)}
  h2 .num{color:var(--primary);margin-right:9px}
  .sub{color:var(--muted-fg);font-size:12.5px;margin:0 0 18px}
  h3{margin:26px 0 8px;font-size:15px;line-height:23px;font-weight:800;color:var(--primary)}
  p{margin:0 0 12px;color:var(--fg);opacity:.92}
  ul,ol{margin:0 0 12px;padding-left:20px;color:var(--fg);opacity:.92}
  li{margin-bottom:6px}
  strong{color:var(--fg);opacity:1;font-weight:700}
  code{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--primary)}
  a{color:var(--primary)}

  .callout{border:1px solid rgba(41,214,185,.3);background:rgba(41,214,185,.08);border-radius:10px;padding:14px 16px;margin:16px 0}
  .callout .t{font-weight:800;color:var(--primary);margin-bottom:5px;font-size:13px}
  .callout p:last-child{margin-bottom:0}
  .callout.warn{border-color:var(--amber-br);background:var(--amber-bg)} .callout.warn .t{color:var(--amber)}
  .callout.bad{border-color:var(--red-br);background:var(--red-bg)} .callout.bad .t{color:var(--red)}
  .callout.ok{border-color:var(--green-br);background:var(--green-bg)} .callout.ok .t{color:var(--green)}
  .callout.info{border-color:var(--blue-br);background:var(--blue-bg)} .callout.info .t{color:var(--blue)}

  .tw{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:12px;line-height:19px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--fg);opacity:.92}
  th{background:rgba(255,255,255,.03);font-weight:800;color:var(--fg);opacity:1;font-size:11px;text-transform:uppercase;position:sticky;top:0}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-family:var(--mono);font-size:11.5px}

  .chip{display:inline-block;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;color:var(--muted-fg)}
  .chip.brand{background:rgba(41,214,185,.1);border-color:rgba(41,214,185,.3);color:var(--primary)}
  .chip.green{background:var(--green-bg);border-color:var(--green-br);color:var(--green)}
  .chip.red{background:var(--red-bg);border-color:var(--red-br);color:var(--red)}
  .chip.amber{background:var(--amber-bg);border-color:var(--amber-br);color:var(--amber)}
  .chip.blue{background:var(--blue-bg);border-color:var(--blue-br);color:var(--blue)}

  figure{margin:18px 0}
  /* Diagram frame, ported from src/components/diagrams/DiagramFrame.tsx.
     Diagrams are hand-authored inline SVG (boxes + arrows), not Mermaid —
     this matches the portfolio's own diagram components exactly and avoids
     Mermaid's rendering-engine defects entirely (see the diagram guide below). */
  .diagram{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;overflow-x:auto;text-align:center;
    box-shadow:0 10px 24px rgba(41,214,185,.08)}
  .diagram svg{display:block;margin:0 auto;height:auto;max-width:100%;min-width:480px}
  figcaption{font-size:11.5px;color:var(--muted-fg);margin-top:8px;text-align:center;font-style:italic}

  footer{color:var(--muted-fg);font-size:11.5px;text-align:center;padding:26px 0 0}
  footer a{color:var(--muted-fg)}

  @media (max-width:1000px){
    .wrap{grid-template-columns:1fr;gap:0}
    nav.side{position:static;max-height:none;margin-bottom:20px}
    section{padding:20px}
  }
  @media print{
    body{background:#fff;color:#000} nav.side{display:none} .wrap{grid-template-columns:1fr;padding:0}
    section{break-inside:avoid;box-shadow:none;border-color:#ccc;background:#fff;color:#000;backdrop-filter:none}
    header.top{background:var(--accent-dark)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

<script>
  const links=[...document.querySelectorAll('nav.side a')];
  const secs=links.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);
  const sync=()=>{ let cur=secs[0];
    for(const s of secs){ if(s.getBoundingClientRect().top<=140) cur=s; }
    links.forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+(cur&&cur.id))); };
  window.addEventListener('scroll',sync,{passive:true}); sync();
</script>
